<section class="app-auth-page">
  @switch (status()) {
    @case ('pending') {
      <p>Confirmation en cours...</p>
    }
    @case ('success') {
      <div class="app-auth-page__panel">
        <p class="app-auth-page__panel-title">Compte confirmé !</p>
        <p>Ton compte est activé, tu peux te connecter.</p>
      </div>
      <div class="app-auth-page__links">
        <p><a routerLink="/auth/login">Se connecter</a></p>
      </div>
    }
    @case ('error') {
      <p class="app-auth-page__error">Lien de confirmation invalide ou expiré.</p>
    }
  }
</section>
