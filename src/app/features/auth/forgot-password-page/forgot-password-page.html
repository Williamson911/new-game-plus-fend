<section class="app-auth-page">
  <h1>Mot de passe oublié</h1>

  @if (submitted()) {
    <div class="app-auth-page__panel">
      <p class="app-auth-page__panel-title">Email envoyé !</p>
      <p>Si un compte existe avec cette adresse, un lien de réinitialisation vient d'être envoyé.</p>
    </div>
    <div class="app-auth-page__links">
      <p><a routerLink="/auth/login">Retour à la connexion</a></p>
    </div>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()">
      <app-text-field label="Email" type="email" formControlName="email" />
      <app-button type="submit" [disabled]="submitting()" [bordered]="false">Envoyer le lien</app-button>
    </form>
  }
</section>
